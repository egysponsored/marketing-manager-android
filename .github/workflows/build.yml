name: Build Marketing Manager APKs

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Create Android project
        shell: bash
        run: |
          set -euo pipefail

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "MarketingManagerAndroid"
          include(":admin", ":client")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id "com.android.application" version "8.7.3" apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=false
          android.nonTransitiveRClass=true
          EOF

          create_module() {
            MODULE="$1"
            APP_ID="$2"
            APP_NAME="$3"
            MODE="$4"
            ICON_COLOR="$5"

            PKG_PATH="$(echo "$APP_ID" | tr '.' '/')"
            mkdir -p "$MODULE/src/main/java/$PKG_PATH"
            mkdir -p "$MODULE/src/main/res/drawable"
            mkdir -p "$MODULE/src/main/res/values"
            mkdir -p "$MODULE/src/main/res/xml"

            cat > "$MODULE/build.gradle" <<EOF
          plugins {
              id "com.android.application"
          }

          android {
              namespace "$APP_ID"
              compileSdk 35

              defaultConfig {
                  applicationId "$APP_ID"
                  minSdk 24
                  targetSdk 35
                  versionCode 1
                  versionName "1.0.0"
              }

              buildTypes {
                  debug {
                      minifyEnabled false
                  }
              }
          }
          EOF

            cat > "$MODULE/src/main/AndroidManifest.xml" <<EOF
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>

              <application
                  android:allowBackup="true"
                  android:icon="@drawable/ic_launcher"
                  android:roundIcon="@drawable/ic_launcher"
                  android:label="$APP_NAME"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar"
                  android:usesCleartextTraffic="true"
                  android:networkSecurityConfig="@xml/network_security_config">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

            cat > "$MODULE/src/main/res/xml/network_security_config.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <network-security-config>
              <base-config cleartextTrafficPermitted="true">
                  <trust-anchors>
                      <certificates src="system"/>
                  </trust-anchors>
              </base-config>
          </network-security-config>
          EOF

            cat > "$MODULE/src/main/res/values/strings.xml" <<EOF
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">$APP_NAME</string>
          </resources>
          EOF

            cat > "$MODULE/src/main/res/drawable/ic_launcher.xml" <<EOF
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">

              <path
                  android:fillColor="$ICON_COLOR"
                  android:pathData="M0,0h108v108h-108z"/>

              <path
                  android:fillColor="#FFFFFFFF"
                  android:pathData="M22,24h64v12h-64zM22,48h64v12h-64zM22,72h40v12h-40z"/>
          </vector>
          EOF

            cat > "$MODULE/src/main/java/$PKG_PATH/MainActivity.java" <<EOF
          package $APP_ID;

          import android.app.Activity;
          import android.content.Context;
          import android.content.SharedPreferences;
          import android.graphics.Color;
          import android.os.Bundle;
          import android.text.InputType;
          import android.view.Gravity;
          import android.view.View;
          import android.view.ViewGroup;
          import android.webkit.WebResourceError;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.Button;
          import android.widget.EditText;
          import android.widget.LinearLayout;
          import android.widget.ProgressBar;
          import android.widget.TextView;
          import android.widget.Toast;

          public class MainActivity extends Activity {

              private static final String PREFS = "marketing_manager_prefs";
              private static final String KEY_SERVER = "server_url";
              private static final String MODE = "$MODE";

              private LinearLayout root;
              private WebView webView;
              private ProgressBar progress;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  showStartScreen();
              }

              private int dp(int value) {
                  return Math.round(value * getResources().getDisplayMetrics().density);
              }

              private TextView title(String text, int sizeSp) {
                  TextView tv = new TextView(this);
                  tv.setText(text);
                  tv.setTextSize(sizeSp);
                  tv.setTextColor(Color.rgb(25, 25, 25));
                  tv.setGravity(Gravity.CENTER);
                  tv.setPadding(dp(16), dp(12), dp(16), dp(12));
                  return tv;
              }

              private void showStartScreen() {
                  root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setGravity(Gravity.CENTER_HORIZONTAL);
                  root.setPadding(dp(24), dp(40), dp(24), dp(24));
                  root.setBackgroundColor(Color.WHITE);

                  TextView appTitle = title("$APP_NAME", 26);
                  appTitle.setTypeface(null, android.graphics.Typeface.BOLD);
                  root.addView(appTitle, new LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.WRAP_CONTENT));

                  TextView subtitle = title(
                          MODE.equals("admin") ? "نسخة الإدارة" : "نسخة العميل",
                          18
                  );
                  root.addView(subtitle);

                  TextView hint = title("اكتب رابط السيرفر ثم اضغط اتصال", 16);
                  root.addView(hint);

                  EditText server = new EditText(this);
                  server.setHint("https://example.com");
                  server.setSingleLine(true);
                  server.setTextDirection(View.TEXT_DIRECTION_LTR);
                  server.setInputType(InputType.TYPE_CLASS_TEXT | InputType.TYPE_TEXT_VARIATION_URI);

                  SharedPreferences prefs = getSharedPreferences(PREFS, Context.MODE_PRIVATE);
                  server.setText(prefs.getString(KEY_SERVER, ""));

                  LinearLayout.LayoutParams editParams = new LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.WRAP_CONTENT
                  );
                  editParams.setMargins(0, dp(18), 0, dp(18));
                  root.addView(server, editParams);

                  Button connect = new Button(this);
                  connect.setText("اتصال");
                  root.addView(connect, new LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          dp(56)
                  ));

                  TextView note = title(
                          "لو السيرفر غير متاح، التطبيق يفضل مفتوح وتقدر تغير الرابط في أي وقت.",
                          14
                  );
                  root.addView(note);

                  connect.setOnClickListener(v -> {
                      String url = server.getText().toString().trim();

                      if (url.isEmpty()) {
                          Toast.makeText(this, "اكتب رابط السيرفر", Toast.LENGTH_SHORT).show();
                          return;
                      }

                      if (!url.startsWith("http://") && !url.startsWith("https://")) {
                          url = "https://" + url;
                      }

                      while (url.endsWith("/")) {
                          url = url.substring(0, url.length() - 1);
                      }

                      prefs.edit().putString(KEY_SERVER, url).apply();
                      openWeb(url);
                  });

                  setContentView(root);
              }

              private void openWeb(String baseUrl) {
                  LinearLayout container = new LinearLayout(this);
                  container.setOrientation(LinearLayout.VERTICAL);
                  container.setBackgroundColor(Color.WHITE);

                  LinearLayout topBar = new LinearLayout(this);
                  topBar.setOrientation(LinearLayout.HORIZONTAL);
                  topBar.setGravity(Gravity.CENTER_VERTICAL);
                  topBar.setPadding(dp(8), dp(6), dp(8), dp(6));

                  Button changeServer = new Button(this);
                  changeServer.setText("تغيير السيرفر");

                  topBar.addView(changeServer, new LinearLayout.LayoutParams(
                          0,
                          ViewGroup.LayoutParams.WRAP_CONTENT,
                          1f
                  ));

                  Button reload = new Button(this);
                  reload.setText("تحديث");

                  topBar.addView(reload, new LinearLayout.LayoutParams(
                          0,
                          ViewGroup.LayoutParams.WRAP_CONTENT,
                          1f
                  ));

                  container.addView(topBar);

                  progress = new ProgressBar(this);

                  container.addView(progress, new LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          dp(4)
                  ));

                  webView = new WebView(this);

                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);
                  settings.setAllowFileAccess(false);
                  settings.setSupportZoom(false);
                  settings.setBuiltInZoomControls(false);
                  settings.setDisplayZoomControls(false);
                  settings.setUserAgentString(
                          settings.getUserAgentString()
                          + " MarketingManagerAndroid/1.0"
                  );

                  webView.setWebViewClient(new WebViewClient() {

                      @Override
                      public void onPageFinished(WebView view, String url) {
                          progress.setVisibility(View.GONE);
                      }

                      @Override
                      public void onReceivedError(
                              WebView view,
                              WebResourceRequest request,
                              WebResourceError error) {

                          if (request.isForMainFrame()) {
                              progress.setVisibility(View.GONE);

                              Toast.makeText(
                                      MainActivity.this,
                                      "تعذر فتح السيرفر. راجع الرابط أو الاتصال بالإنترنت.",
                                      Toast.LENGTH_LONG
                              ).show();
                          }
                      }
                  });

                  container.addView(
                          webView,
                          new LinearLayout.LayoutParams(
                                  ViewGroup.LayoutParams.MATCH_PARENT,
                                  0,
                                  1f
                          )
                  );

                  changeServer.setOnClickListener(v -> showStartScreen());

                  reload.setOnClickListener(v -> {
                      progress.setVisibility(View.VISIBLE);
                      webView.reload();
                  });

                  setContentView(container);

                  String path =
                          MODE.equals("admin")
                          ? "/admin/"
                          : "/client/";

                  progress.setVisibility(View.VISIBLE);
                  webView.loadUrl(baseUrl + path);
              }

              @Override
              public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }

              @Override
              protected void onDestroy() {
                  if (webView != null) {
                      webView.destroy();
                      webView = null;
                  }

                  super.onDestroy();
              }
          }
          EOF
          }

          create_module "admin" \
            "com.egysponsored.marketingmanager.admin" \
            "Marketing Manager Admin" \
            "admin" \
            "#FF0F6CBD"

          create_module "client" \
            "com.egysponsored.marketingmanager.client" \
            "Marketing Manager Client" \
            "client" \
            "#FF1E8E3E"

      - name: Build APKs
        shell: bash
        run: |
          gradle :admin:assembleDebug :client:assembleDebug --stacktrace

      - name: Prepare APK files
        shell: bash
        run: |
          mkdir -p output
          cp admin/build/outputs/apk/debug/admin-debug.apk output/Marketing_Manager_Admin.apk
          cp client/build/outputs/apk/debug/client-debug.apk output/Marketing_Manager_Client.apk
          ls -lh output

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: Marketing-Manager-APKs
          path: output/*.apk
          if-no-files-found: error
          retention-days: 30
