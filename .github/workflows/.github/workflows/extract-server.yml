name: Extract Server

on:
  workflow_dispatch:
  push:
    paths:
      - "marketing-manager-server.zip"
      - ".github/workflows/extract-server.yml"

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Extract server
        run: |
          unzip -o marketing-manager-server.zip
          ls -la server

      - name: Commit extracted server
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add server
          git commit -m "Extract backend server" || exit 0
          git push
